[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matching-project"
version = "0.1.0"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["core", "data", "mechanisms", "metrics"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]